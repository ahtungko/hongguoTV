<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>红果短剧 Web版</title>
  <style>
    :root {
      --bg-base: #090d16;
      --bg-card: #131b2e;
      --bg-card-hover: #1c2742;
      --primary: #f43f5e;
      --primary-hover: #e11d48;
      --primary-light: rgba(244, 63, 94, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(244, 63, 94, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 顶部导航 */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }

    .brand .logo-badge {
      background: linear-gradient(135deg, #f43f5e, #fb7185);
      color: white;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      padding: 4px 12px;
      max-width: 460px;
      flex: 1;
      transition: all 0.2s;
    }

    .search-bar:focus-within {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.9rem;
      width: 100%;
      padding: 6px 4px;
    }

    .search-bar input::placeholder {
      color: #64748b;
    }

    .search-bar button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .search-bar button:hover {
      color: var(--primary);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .nav-btn:hover, .nav-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-color);
    }

    .nav-btn.active {
      color: var(--primary);
      font-weight: 600;
    }

    /* 主内容区 */
    main {
      flex: 1;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      display: block;
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 剧集网格 */
    .drama-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    @media (min-width: 640px) {
      .drama-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }
    }

    @media (min-width: 1024px) {
      .drama-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
    }

    .drama-card {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .drama-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.6);
      border-color: rgba(244, 63, 94, 0.4);
    }

    .drama-cover-wrap {
      width: 100%;
      aspect-ratio: 7 / 10;
      position: relative;
      background: #1e293b;
      overflow: hidden;
    }

    .drama-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .drama-card:hover .drama-cover {
      transform: scale(1.04);
    }

    .drama-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #fb7185;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .drama-info {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .drama-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drama-tags {
      font-size: 0.75rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drama-desc {
      font-size: 0.75rem;
      color: #64748b;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      margin-top: 2px;
    }

    /* 分页控件 */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px 0 40px;
    }

    .page-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }

    .page-btn:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--primary);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* 播放器与详情弹层/页面 */
    .player-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-base);
      z-index: 100;
      overflow-y: auto;
      flex-direction: column;
    }

    .player-view.active {
      display: flex;
    }

    .player-header {
      padding: 12px 20px;
      background: rgba(9, 13, 22, 0.9);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .player-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 16px;
      gap: 20px;
    }

    @media (min-width: 900px) {
      .player-layout {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    /* 视频播放容器 */
    .player-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex: 1;
    }

    .video-container {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 899px) {
      .video-container {
        max-width: 100%;
        max-height: 65vh;
      }
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    video.fit-cover {
      object-fit: cover;
    }

    /* 播放控制增强条 */
    .player-controls-bar {
      width: 100%;
      max-width: 480px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-card);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #cbd5e1;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .ctrl-btn:hover, .ctrl-btn.active {
      color: #fff;
      background: var(--primary);
    }

    /* 详情和选集面板 */
    .player-right {
      width: 100%;
      background: var(--bg-card);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 900px) {
      .player-right {
        width: 380px;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
      }
    }

    .detail-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .fav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-light);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .fav-btn.favorited {
      background: var(--primary);
    }

    .detail-intro {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.5;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 8px;
    }

    /* 选集网格 */
    .episodes-title {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .episode-range-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .range-tab {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .range-tab.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .episode-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px;
    }

    .episode-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.15s;
    }

    .episode-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--primary);
    }

    .episode-btn.active {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
    }

    .episode-btn.watched:not(.active) {
      opacity: 0.6;
    }

    /* 空状态 / 加载状态 */
    .empty-state, .loading-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast 提示 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 200;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 设置 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 150;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .modal-input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      margin-top: 6px;
      margin-bottom: 16px;
    }

    .modal-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 全屏密码保护锁屏 */
    .lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 30%, #172138 0%, #090d16 100%);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(24px);
    }

    .lock-card {
      width: 100%;
      max-width: 380px;
      background: rgba(19, 27, 46, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: lockPopIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes lockPopIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes lockShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .lock-card.shake {
      animation: lockShake 0.4s ease-in-out;
    }

    .lock-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(244, 63, 94, 0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 18px;
      box-shadow: 0 0 24px rgba(244, 63, 94, 0.25);
    }

    .lock-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .lock-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .lock-input-group {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
    }

    .lock-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 13px 44px 13px 16px;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }

    .lock-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .lock-eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-muted);
      padding: 4px;
    }

    .lock-remember-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      margin-bottom: 14px;
    }

    .lock-remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .lock-remember-label input[type="checkbox"] {
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
    }

    .lock-error-msg {
      font-size: 0.82rem;
      color: #f43f5e;
      min-height: 20px;
      margin-bottom: 12px;
      text-align: left;
      width: 100%;
    }

    .lock-submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      border: none;
      border-radius: 12px;
      padding: 13px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(244, 63, 94, 0.35);
      transition: all 0.2s;
    }

    .lock-submit-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .lock-submit-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <!-- 全屏密码保护锁屏 -->
  <div class="lock-screen" id="lockScreen" style="display: none;">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2 class="lock-title">私人影院 · 访问保护</h2>
      <p class="lock-subtitle">本站已开启访问口令保护，请输入访问密码以解锁影视库</p>

      <form onsubmit="app.submitPassword(event)" style="width: 100%;">
        <div class="lock-input-group">
          <input 
            type="password" 
            class="lock-input" 
            id="lockPasswordInput" 
            placeholder="请输入访问口令 / 密码" 
            autocomplete="current-password"
          >
          <button type="button" class="lock-eye-btn" onclick="app.togglePasswordEye()" title="显示/隐藏密码">👁️</button>
        </div>

        <div class="lock-remember-row">
          <label class="lock-remember-label">
            <input type="checkbox" id="lockRememberCheckbox" checked>
            <span>在此浏览器上记住密码</span>
          </label>
        </div>

        <div class="lock-error-msg" id="lockErrorMsg"></div>

        <button type="submit" class="lock-submit-btn" id="lockSubmitBtn">
          <span>解 锁 进 入</span>
        </button>
      </form>
    </div>
  </div>

  <!-- 顶部导航 -->
  <header>
    <a class="brand" href="javascript:void(0)" onclick="app.showHome()">
      <span class="logo-badge">红果</span>
      <span>短剧 Web</span>
    </a>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索短剧名、题材、关键词..." onkeydown="if(event.key==='Enter') app.search()">
      <button onclick="app.search()" title="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>

    <div class="nav-actions">
      <button class="nav-btn active" id="btnNavHome" onclick="app.showHome()">精选</button>
      <button class="nav-btn" id="btnNavHistory" onclick="app.showHistory()">历史</button>
      <button class="nav-btn" id="btnNavFavorites" onclick="app.showFavorites()">收藏</button>
      <button class="nav-btn" id="btnLockApp" onclick="app.lockApp()" title="退出并锁定" style="color:var(--text-muted)">🔒 锁定</button>
    </div>
  </header>

  <!-- 主内容展示区 -->
  <main>
    <div class="section-header">
      <h2 class="section-title" id="sectionTitle">精选推荐</h2>
      <div id="sectionExtra"></div>
    </div>

    <div id="mainContent">
      <div class="loading-state">
        <div class="spinner"></div>
        <div>加载剧集列表中...</div>
      </div>
    </div>

    <!-- 分页控件 -->
    <div class="pagination" id="paginationWrap" style="display: none;">
      <button class="page-btn" id="prevPageBtn" onclick="app.prevPage()">上一页</button>
      <span class="page-indicator" id="pageIndicator">第 1 页</span>
      <button class="page-btn" id="nextPageBtn" onclick="app.nextPage()">下一页</button>
    </div>
  </main>

  <!-- 独立播放与详情视图 -->
  <div class="player-view" id="playerView">
    <div class="player-header">
      <button class="back-btn" onclick="app.closePlayer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        返回列表
      </button>
      <span id="playerCurrentDramaTitle" style="font-weight:600; font-size:0.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%;"></span>
      <button class="fav-btn" id="playerFavBtn" onclick="app.toggleFavorite()">❤️ 收藏</button>
    </div>

    <div class="player-layout">
      <!-- 播放器区域 -->
      <div class="player-left">
        <div class="video-container">
          <video id="videoPlayer" controls playsinline preload="auto"></video>
        </div>

        <div class="player-controls-bar">
          <div class="ctrl-group">
            <span style="font-size:0.75rem; color:var(--text-muted)">倍速:</span>
            <button class="ctrl-btn active" onclick="app.setSpeed(1.0, this)">1.0x</button>
            <button class="ctrl-btn" onclick="app.setSpeed(1.25, this)">1.25x</button>
            <button class="ctrl-btn" onclick="app.setSpeed(1.5, this)">1.5x</button>
            <button class="ctrl-btn" onclick="app.setSpeed(2.0, this)">2.0x</button>
          </div>
          <div class="ctrl-group">
            <button class="ctrl-btn" onclick="app.playPrevEpisode()">⏮️ 上一集</button>
            <button class="ctrl-btn" onclick="app.toggleFit(this)">铺满画面</button>
            <button class="ctrl-btn" onclick="app.playNextEpisode()">下一集 ⏩</button>
          </div>
        </div>
      </div>

      <!-- 详情与选集 -->
      <div class="player-right">
        <div>
          <h1 class="detail-title" id="dramaDetailTitle">剧名</h1>
          <div class="detail-meta" id="dramaDetailMeta" style="margin-top: 6px;"></div>
        </div>

        <div class="detail-intro" id="dramaDetailIntro">简介</div>

        <div>
          <div class="episodes-title">
            <span>选集列表 (<span id="episodesCount">0</span>)</span>
            <div class="episode-range-tabs" id="rangeTabs"></div>
          </div>
          <div class="episode-grid" id="episodeGrid" style="margin-top: 10px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 口令设置模态窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <h3 class="modal-title">服务访问口令设置</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">
        如果您的后端服务设置了 <code>BRIDGE_TOKEN</code>，请在此填入口令；未设置请留空。
      </p>
      <input type="text" class="modal-input" id="tokenInput" placeholder="请输入口令 (可选)">
      <div class="modal-actions">
        <button class="page-btn" onclick="app.closeSettings()">取消</button>
        <button class="page-btn" style="background:var(--primary);border-color:var(--primary)" onclick="app.saveSettings()">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script>
    const app = {
      currentPage: 1,
      currentView: 'home', // 'home' | 'search' | 'history' | 'favorites'
      searchKeyword: '',
      token: localStorage.getItem('hongguo_token') || '',
      currentSeries: null,
      currentEpisodes: [],
      currentEpisodeIndex: 0,
      rangeSize: 30,
      currentRangeIndex: 0,

      // 初始化
      async init() {
        this.setupVideoEvents();
        try {
          await this.loadHome(1);
        } catch (err) {
          // 若为 401 授权错误，fetchApi 已自动唤起锁屏界面
        }
      },

      getVideo() {
        return document.getElementById('videoPlayer');
      },

      // 提示消息
      toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2500);
      },

      // 通用 API 请求封装
      async fetchApi(endpoint) {
        const headers = {};
        if (this.token) {
          headers['Authorization'] = `Bearer ${this.token}`;
        }
        const resp = await fetch(endpoint, { headers });
        if (resp.status === 401) {
          this.showLockScreen(this.token ? '访问口令失效或错误，请重新输入' : '本站已设置访问保护，请输入访问口令');
          throw new Error('未授权');
        }
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || `请求失败 (HTTP ${resp.status})`);
        }
        return resp.json();
      },

      // 切换导航高亮
      setNav(activeId) {
        document.querySelectorAll('.nav-actions .nav-btn').forEach(btn => btn.classList.remove('active'));
        if (activeId) document.getElementById(activeId)?.classList.add('active');
      },

      // 加载首页精选
      async loadHome(page = 1) {
        this.currentView = 'home';
        this.currentPage = page;
        this.setNav('btnNavHome');
        document.getElementById('sectionTitle').textContent = '精选推荐';
        document.getElementById('sectionExtra').innerHTML = '';
        this.renderLoading();

        try {
          const data = await this.fetchApi(`/api/home?page=${page}`);
          this.renderGrid(data.items || []);
          this.updatePagination(data.items?.length > 0);
        } catch (err) {
          this.renderError(err.message);
        }
      },

      showHome() {
        document.getElementById('searchInput').value = '';
        this.loadHome(1);
      },

      // 搜索剧集
      async search(page = 1) {
        const keyword = (document.getElementById('searchInput').value || '').trim();
        if (!keyword) {
          this.toast('请输入搜索关键词');
          return;
        }
        this.currentView = 'search';
        this.searchKeyword = keyword;
        this.currentPage = page;
        this.setNav(null);
        document.getElementById('sectionTitle').textContent = `搜索结果: "${keyword}"`;
        document.getElementById('sectionExtra').innerHTML = `<button class="page-btn" style="padding:4px 10px;font-size:0.8rem;" onclick="app.showHome()">清空搜索</button>`;
        this.renderLoading();

        try {
          const data = await this.fetchApi(`/api/search?q=${encodeURIComponent(keyword)}&page=${page}`);
          this.renderGrid(data.items || []);
          this.updatePagination(data.items?.length > 0);
        } catch (err) {
          this.renderError(err.message);
        }
      },

      // 历史记录与收藏
      getHistory() {
        try { return JSON.parse(localStorage.getItem('hongguo_history') || '[]'); } catch { return []; }
      },
      saveHistory(item) {
        let list = this.getHistory().filter(h => h.id !== item.id);
        list.unshift(item);
        if (list.length > 100) list = list.slice(0, 100);
        localStorage.setItem('hongguo_history', JSON.stringify(list));
      },
      getFavorites() {
        try { return JSON.parse(localStorage.getItem('hongguo_favorites') || '[]'); } catch { return []; }
      },
      isFavorited(id) {
        return this.getFavorites().some(f => f.id === id);
      },
      toggleFavorite() {
        if (!this.currentSeries) return;
        let list = this.getFavorites();
        const id = this.currentSeries.id;
        const exists = list.some(f => f.id === id);
        if (exists) {
          list = list.filter(f => f.id !== id);
          this.toast('已取消收藏');
        } else {
          list.unshift({
            id: this.currentSeries.id,
            title: this.currentSeries.title,
            cover: this.currentSeries.cover,
            badge: this.currentSeries.badge,
            tags: this.currentSeries.tags,
            description: this.currentSeries.description,
            time: Date.now()
          });
          this.toast('已加入收藏');
        }
        localStorage.setItem('hongguo_favorites', JSON.stringify(list));
        this.updateFavButton();
      },
      updateFavButton() {
        const btn = document.getElementById('playerFavBtn');
        if (!this.currentSeries || !btn) return;
        const fav = this.isFavorited(this.currentSeries.id);
        btn.textContent = fav ? '❤️ 已收藏' : '🤍 收藏';
        btn.classList.toggle('favorited', fav);
      },

      showHistory() {
        this.currentView = 'history';
        this.setNav('btnNavHistory');
        document.getElementById('sectionTitle').textContent = '最近观看历史';
        document.getElementById('sectionExtra').innerHTML = `<button class="page-btn" style="padding:4px 10px;font-size:0.8rem;" onclick="app.clearHistory()">清空历史</button>`;
        document.getElementById('paginationWrap').style.display = 'none';
        const list = this.getHistory();
        if (!list.length) {
          this.renderEmpty('暂无观看历史');
          return;
        }
        this.renderGrid(list);
      },

      clearHistory() {
        if (confirm('确认清空所有观看历史吗？')) {
          localStorage.removeItem('hongguo_history');
          this.showHistory();
          this.toast('观看记录已清空');
        }
      },

      showFavorites() {
        this.currentView = 'favorites';
        this.setNav('btnNavFavorites');
        document.getElementById('sectionTitle').textContent = '我的收藏';
        document.getElementById('sectionExtra').innerHTML = '';
        document.getElementById('paginationWrap').style.display = 'none';
        const list = this.getFavorites();
        if (!list.length) {
          this.renderEmpty('暂无收藏短剧');
          return;
        }
        this.renderGrid(list);
      },

      // 分页动作
      prevPage() {
        if (this.currentPage <= 1) return;
        if (this.currentView === 'home') this.loadHome(this.currentPage - 1);
        else if (this.currentView === 'search') this.search(this.currentPage - 1);
      },
      nextPage() {
        if (this.currentView === 'home') this.loadHome(this.currentPage + 1);
        else if (this.currentView === 'search') this.search(this.currentPage + 1);
      },
      updatePagination(hasItems) {
        const wrap = document.getElementById('paginationWrap');
        if (this.currentView !== 'home' && this.currentView !== 'search') {
          wrap.style.display = 'none';
          return;
        }
        wrap.style.display = 'flex';
        document.getElementById('pageIndicator').textContent = `第 ${this.currentPage} 页`;
        document.getElementById('prevPageBtn').disabled = this.currentPage <= 1;
        document.getElementById('nextPageBtn').disabled = !hasItems;
      },

      // UI 状态渲染
      renderLoading() {
        document.getElementById('mainContent').innerHTML = `
          <div class="loading-state">
            <div class="spinner"></div>
            <div>数据加载中...</div>
          </div>`;
      },
      renderEmpty(msg = '暂无相关短剧') {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div style="font-size:2.5rem;margin-bottom:10px;">🎬</div>
            <div>${msg}</div>
          </div>`;
      },
      renderError(msg) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div style="font-size:2.5rem;margin-bottom:10px;color:var(--primary);">⚠️</div>
            <div style="color:#fff;font-weight:600;margin-bottom:6px;">出错了</div>
            <div style="font-size:0.85rem;">${msg}</div>
            <button class="page-btn" style="margin-top:16px;" onclick="app.loadHome(1)">重试首页</button>
          </div>`;
      },

      // 渲染剧集列表
      renderGrid(items) {
        if (!items || !items.length) {
          this.renderEmpty(this.currentView === 'search' ? '未找到相关剧集，请尝试更换关键词' : '暂无内容');
          return;
        }
        const grid = document.createElement('div');
        grid.className = 'drama-grid';

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'drama-card';
          card.onclick = () => this.openDrama(item.id);

          const fallbackCover = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" fill="%231e293b"><rect width="200" height="280"/><text x="50%" y="50%" fill="%2364748b" font-size="14" text-anchor="middle" dominant-baseline="middle">暂无海报</text></svg>';

          card.innerHTML = `
            <div class="drama-cover-wrap">
              <img class="drama-cover" src="${item.cover || fallbackCover}" alt="${item.title}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackCover}'">
              ${item.badge ? `<span class="drama-badge">${item.badge}</span>` : ''}
            </div>
            <div class="drama-info">
              <h3 class="drama-title" title="${item.title}">${item.title}</h3>
              ${item.tags ? `<p class="drama-tags">${item.tags}</p>` : ''}
              ${item.description ? `<p class="drama-desc">${item.description}</p>` : ''}
            </div>`;
          grid.appendChild(card);
        });

        const container = document.getElementById('mainContent');
        container.innerHTML = '';
        container.appendChild(grid);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      // 打开剧集详情与播放
      async openDrama(seriesId) {
        this.toast('正在载入剧集与分集...');
        try {
          const detail = await this.fetchApi(`/api/series/${seriesId}`);
          this.currentSeries = detail;
          this.currentEpisodes = detail.episodes || [];
          if (!this.currentEpisodes.length) {
            this.toast('该剧暂无可用分集');
            return;
          }

          // 填充详情信息
          document.getElementById('dramaDetailTitle').textContent = detail.title;
          document.getElementById('playerCurrentDramaTitle').textContent = detail.title;
          document.getElementById('dramaDetailMeta').innerHTML = `
            <span>${detail.badge || `全 ${this.currentEpisodes.length} 集`}</span>
            ${detail.tags ? `<span>•</span><span>${detail.tags}</span>` : ''}`;
          document.getElementById('dramaDetailIntro').textContent = detail.description || '暂无简介';
          document.getElementById('episodesCount').textContent = this.currentEpisodes.length;

          this.updateFavButton();

          // 检查历史续播记录
          const historyList = this.getHistory();
          const lastWatched = historyList.find(h => h.id === seriesId);
          let targetIndex = 0;
          let startTime = 0;
          if (lastWatched && typeof lastWatched.episodeIndex === 'number' && lastWatched.episodeIndex < this.currentEpisodes.length) {
            targetIndex = lastWatched.episodeIndex;
            startTime = lastWatched.currentTime || 0;
          }

          this.renderEpisodeTabs();
          this.renderEpisodeButtons(targetIndex);

          // 显示播放页面
          document.getElementById('playerView').classList.add('active');
          document.body.style.overflow = 'hidden';

          // 播放分集
          this.playEpisode(targetIndex, startTime);
        } catch (err) {
          this.toast(err.message);
        }
      },

      // 播放分集
      playEpisode(index, resumeTime = 0) {
        if (index < 0 || index >= this.currentEpisodes.length) return;
        this.currentEpisodeIndex = index;
        const episode = this.currentEpisodes[index];
        const video = this.getVideo();
        if (!video) return;

        const tokenQuery = this.token ? `?token=${encodeURIComponent(this.token)}` : '';
        const streamUrl = `/api/episodes/${episode.id}/stream${tokenQuery}`;
        video.src = streamUrl;

        document.getElementById('playerCurrentDramaTitle').textContent = `${this.currentSeries.title} - ${episode.title || `第 ${index + 1} 集`}`;

        // 重新高亮按钮
        document.querySelectorAll('.episode-btn').forEach((btn, i) => {
          const globalIdx = this.currentRangeIndex * this.rangeSize + i;
          btn.classList.toggle('active', globalIdx === index);
          if (globalIdx === index) btn.classList.add('watched');
        });

        if (resumeTime > 0) {
          video.currentTime = resumeTime;
        }

        video.play().catch(() => {
          // 浏览器自动播放策略限制
        });

        // 记录历史
        this.saveHistory({
          id: this.currentSeries.id,
          title: this.currentSeries.title,
          cover: this.currentSeries.cover,
          badge: this.currentSeries.badge,
          tags: this.currentSeries.tags,
          description: this.currentSeries.description,
          episodeIndex: index,
          episodeTitle: episode.title || `第 ${index + 1} 集`,
          currentTime: resumeTime,
          time: Date.now()
        });
      },

      playPrevEpisode() {
        if (this.currentEpisodeIndex - 1 >= 0) {
          const prevIndex = this.currentEpisodeIndex - 1;
          const prevRange = Math.floor(prevIndex / this.rangeSize);
          if (prevRange !== this.currentRangeIndex) {
            this.currentRangeIndex = prevRange;
            this.renderEpisodeTabs();
            this.renderEpisodeButtons(prevIndex);
          }
          this.playEpisode(prevIndex);
          this.toast(`正在播放上一集 (第 ${prevIndex + 1} 集)`);
        } else {
          this.toast('已经是第一集了');
        }
      },

      playNextEpisode() {
        if (this.currentEpisodeIndex + 1 < this.currentEpisodes.length) {
          const nextIndex = this.currentEpisodeIndex + 1;
          // 若跨越了分组区间，切换 tab
          const nextRange = Math.floor(nextIndex / this.rangeSize);
          if (nextRange !== this.currentRangeIndex) {
            this.currentRangeIndex = nextRange;
            this.renderEpisodeTabs();
            this.renderEpisodeButtons(nextIndex);
          }
          this.playEpisode(nextIndex);
          this.toast(`正在播放下一集 (第 ${nextIndex + 1} 集)`);
        } else {
          this.toast('已经是最后一集了');
        }
      },

      // 选集分页 Tab 渲染 (1-30, 31-60...)
      renderEpisodeTabs() {
        const total = this.currentEpisodes.length;
        const container = document.getElementById('rangeTabs');
        container.innerHTML = '';
        if (total <= this.rangeSize) return;

        const count = Math.ceil(total / this.rangeSize);
        for (let i = 0; i < count; i++) {
          const start = i * this.rangeSize + 1;
          const end = Math.min((i + 1) * this.rangeSize, total);
          const tab = document.createElement('button');
          tab.className = `range-tab ${i === this.currentRangeIndex ? 'active' : ''}`;
          tab.textContent = `${start}-${end}`;
          tab.onclick = () => {
            this.currentRangeIndex = i;
            this.renderEpisodeTabs();
            this.renderEpisodeButtons(this.currentEpisodeIndex);
          };
          container.appendChild(tab);
        }
      },

      // 渲染当前区间内的选集按钮
      renderEpisodeButtons(activeGlobalIndex) {
        const container = document.getElementById('episodeGrid');
        container.innerHTML = '';
        const start = this.currentRangeIndex * this.rangeSize;
        const end = Math.min(start + this.rangeSize, this.currentEpisodes.length);

        for (let i = start; i < end; i++) {
          const btn = document.createElement('button');
          btn.className = `episode-btn ${i === activeGlobalIndex ? 'active' : ''}`;
          btn.textContent = i + 1;
          btn.title = this.currentEpisodes[i].title || `第 ${i + 1} 集`;
          btn.onclick = () => this.playEpisode(i);
          container.appendChild(btn);
        }
      },

      // 视频相关事件与控制
      setupVideoEvents() {
        const video = document.getElementById('videoPlayer');
        // 自动连播
        video.addEventListener('ended', () => {
          this.playNextEpisode();
        });

        // 定时保存播放进度
        video.addEventListener('timeupdate', () => {
          if (!this.currentSeries || video.currentTime < 1) return;
          // 每隔 5 秒存储一次本地播放进度
          if (Math.floor(video.currentTime) % 5 === 0) {
            this.saveHistory({
              id: this.currentSeries.id,
              title: this.currentSeries.title,
              cover: this.currentSeries.cover,
              badge: this.currentSeries.badge,
              tags: this.currentSeries.tags,
              description: this.currentSeries.description,
              episodeIndex: this.currentEpisodeIndex,
              episodeTitle: this.currentEpisodes[this.currentEpisodeIndex]?.title,
              currentTime: Math.floor(video.currentTime),
              time: Date.now()
            });
          }
        });

        // 播放失败提示
        video.addEventListener('error', async () => {
          if (video.src) {
            try {
              const res = await fetch(video.src);
              if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                this.toast(data.error || `视频加载失败 (HTTP ${res.status})`);
                return;
              }
            } catch {}
            this.toast('视频加载失败，请检查网络');
          }
        });
      },

      setSpeed(rate, btn) {
        const video = document.getElementById('videoPlayer');
        video.playbackRate = rate;
        document.querySelectorAll('.player-controls-bar .ctrl-btn').forEach(b => {
          if (b.textContent.includes('x')) b.classList.remove('active');
        });
        btn.classList.add('active');
      },

      toggleFit(btn) {
        const video = document.getElementById('videoPlayer');
        const isCover = video.classList.toggle('fit-cover');
        btn.classList.toggle('active', isCover);
        btn.textContent = isCover ? '原始比例' : '铺满画面';
      },

      closePlayer() {
        const video = document.getElementById('videoPlayer');
        video.pause();
        video.src = '';
        document.getElementById('playerView').classList.remove('active');
        document.body.style.overflow = '';
      },

      // 口令保护与锁屏控制
      showLockScreen(errMsg = '') {
        const lock = document.getElementById('lockScreen');
        if (lock) {
          lock.style.display = 'flex';
          const input = document.getElementById('lockPasswordInput');
          input.value = this.token || '';
          setTimeout(() => input.focus(), 150);
          document.getElementById('lockErrorMsg').textContent = errMsg;
        }
      },
      hideLockScreen() {
        const lock = document.getElementById('lockScreen');
        if (lock) lock.style.display = 'none';
      },
      togglePasswordEye() {
        const input = document.getElementById('lockPasswordInput');
        input.type = input.type === 'password' ? 'text' : 'password';
      },
      async submitPassword(e) {
        if (e && e.preventDefault) e.preventDefault();
        const pwd = document.getElementById('lockPasswordInput').value.trim();
        const remember = document.getElementById('lockRememberCheckbox').checked;
        const errorEl = document.getElementById('lockErrorMsg');
        const card = document.querySelector('.lock-card');
        const submitBtn = document.getElementById('lockSubmitBtn');

        if (!pwd) {
          errorEl.textContent = '请输入访问口令';
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '正在验证...';
        errorEl.textContent = '';

        try {
          const resp = await fetch('/api/home?page=1', {
            headers: { 'Authorization': `Bearer ${pwd}` }
          });

          if (resp.status === 401) {
            throw new Error('访问口令错误，请重新输入');
          }
          if (!resp.ok) {
            throw new Error(`验证失败 (HTTP ${resp.status})`);
          }

          // 验证通过
          this.token = pwd;
          if (remember) {
            localStorage.setItem('hongguo_token', pwd);
          } else {
            localStorage.removeItem('hongguo_token');
          }

          this.hideLockScreen();
          this.toast('🔓 验证成功，欢迎观影');
          const data = await resp.json();
          this.currentView = 'home';
          this.currentPage = 1;
          this.renderGrid(data.items || []);
          this.updatePagination(data.items?.length > 0);
        } catch (err) {
          errorEl.textContent = err.message || '访问口令错误';
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '解 锁 进 入';
        }
      },
      lockApp() {
        this.token = '';
        localStorage.removeItem('hongguo_token');
        this.showLockScreen('已退出登录，请输入密码重新进入');
        this.toast('影院已锁定');
      },

      // 口令设置
      openSettings() {
        document.getElementById('tokenInput').value = this.token;
        document.getElementById('settingsModal').classList.add('active');
      },
      closeSettings() {
        document.getElementById('settingsModal').classList.remove('active');
      },
      saveSettings() {
        const val = document.getElementById('tokenInput').value.trim();
        this.token = val;
        localStorage.setItem('hongguo_token', val);
        this.closeSettings();
        this.toast('口令已保存');
        this.loadHome(1);
      }
    };

    // 页面加载完毕初始化
    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
